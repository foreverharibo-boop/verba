name: Fix unification runner anchor v2
on:
  push:
    branches:
      - codex/server-translation-experimental
    paths:
      - .github/workflows/fix-unify-runner-v2.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/server-translation-experimental
      - name: Patch and retrigger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/unify-main-once.yml')
          text=path.read_text()
          old1='"function handleGenerationEnded() {\\n    const ready = automaticOutputLifecycle.end();"'
          new1='"function handleGenerationEnded() {\\n    traceLatestAssistantSource(\'generation-ended\');\\n    const ready = automaticOutputLifecycle.end();"'
          old2='"function handleGenerationEnded() {\\n    executionTrace.trace(\'generation-ended\');\\n    const ready = automaticOutputLifecycle.end();"'
          new2='"function handleGenerationEnded() {\\n    executionTrace.trace(\'generation-ended\');\\n    traceLatestAssistantSource(\'generation-ended\');\\n    const ready = automaticOutputLifecycle.end();"'
          if text.count(old1)!=1 or text.count(old2)!=1:
              raise SystemExit(f'anchor counts: source={text.count(old1)} replacement={text.count(old2)}')
          path.write_text(text.replace(old1,new1,1).replace(old2,new2,1))
          PY
          rm -f .github/workflows/fix-unify-runner.yml .github/workflows/fix-unify-runner-v2.yml
          git add -A
          git commit -m "Fix main unification generation trace anchor"
          git push origin HEAD:codex/server-translation-experimental
