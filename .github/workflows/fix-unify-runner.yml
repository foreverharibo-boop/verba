name: Fix unification runner anchor
on:
  push:
    branches:
      - codex/server-translation-experimental
    paths:
      - .github/workflows/fix-unify-runner.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/server-translation-experimental
      - name: Patch and retrigger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/unify-main-once.yml')
          text=path.read_text()
          old='''              "function handleGenerationEnded() {\\n    const ready = automaticOutputLifecycle.end();",
              "function handleGenerationEnded() {\\n    executionTrace.trace('generation-ended');\\n    const ready = automaticOutputLifecycle.end();",'''
          new='''              "function handleGenerationEnded() {\\n    traceLatestAssistantSource('generation-ended');\\n    const ready = automaticOutputLifecycle.end();",
              "function handleGenerationEnded() {\\n    executionTrace.trace('generation-ended');\\n    traceLatestAssistantSource('generation-ended');\\n    const ready = automaticOutputLifecycle.end();",'''
          if text.count(old)!=1:
              raise SystemExit(f'anchor count={text.count(old)}')
          path.write_text(text.replace(old,new,1))
          PY
          rm -f .github/workflows/fix-unify-runner.yml
          git add -A
          git commit -m "Fix main unification generation trace anchor"
          git push origin HEAD:codex/server-translation-experimental
