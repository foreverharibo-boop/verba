name: Inspect main merge conflicts
on:
  push:
    branches:
      - codex/server-translation-experimental
    paths:
      - .github/workflows/inspect-main-merge.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/server-translation-experimental
          fetch-depth: 0
      - name: Inspect conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          status=$?
          set -e
          echo "merge_status=$status"
          echo "--- conflicted files ---"
          git diff --name-only --diff-filter=U || true
          for file in README.md index.js manifest.json source-change-tracer.js; do
            echo "===== CONFLICT MARKERS: $file ====="
            awk '
              /<<<<<<< / { show=1; before=6 }
              show { print NR ":" $0 }
              />>>>>>> / { after=6; show=0; tail=1; next }
              tail && after-- > 0 { print NR ":" $0 }
              tail && after <= 0 { tail=0 }
            ' "$file" || true
          done
          echo "--- status ---"
          git status --short
          git merge --abort || true
