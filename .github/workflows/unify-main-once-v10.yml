name: Unify server translation into main v10
on:
  push:
    branches:
      - codex/server-translation-experimental
    paths:
      - .github/workflows/unify-main-once-v10.yml
permissions:
  contents: write
jobs:
  unify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/server-translation-experimental
          fetch-depth: 0
      - name: Apply verified base merge and swipe patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import textwrap
          source=Path('.github/workflows/unify-main-once-v5.yml').read_text()
          start=source.index('      - name: Merge and apply unified code\n')
          run=source.index('        run: |\n',start)+len('        run: |\n')
          end=source.index('      - name: Run unified regressions\n',run)
          Path('/tmp/base-unify.sh').write_text(textwrap.dedent(source[run:end]))
          PY
          bash /tmp/base-unify.sh

      - name: Apply verified diagnostic merge
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import textwrap
          source=Path('.github/workflows/unify-main-once-v6.yml').read_text()
          start=source.index('      - name: Merge detailed and lightweight source diagnostics\n')
          run=source.index('        run: |\n',start)+len('        run: |\n')
          end=source.index('\n      - name: Run unified regressions\n',run)
          Path('/tmp/diagnostics-unify.sh').write_text(textwrap.dedent(source[run:end]))
          PY
          bash /tmp/diagnostics-unify.sh

      - name: Write atomic Git-managed installer and migration tests
        shell: bash
        run: |
          set -euo pipefail
          cat > install-server.sh <<'INSTALLER'
          #!/usr/bin/env bash
          set -euo pipefail

          ST_ROOT="${1:-$HOME/SillyTavern}"
          PLUGINS_DIR="$ST_ROOT/plugins"
          DEST="$PLUGINS_DIR/verba-server"
          REPO_URL="${VERBA_SERVER_REPO_URL:-https://github.com/foreverharibo-boop/verba.git}"
          REPO_BRANCH="${VERBA_SERVER_REPO_BRANCH:-main}"
          BACKUP_ROOT="$ST_ROOT/.verba-server-backups"
          STAMP="$(date +%Y%m%d-%H%M%S)"
          TEMP="$PLUGINS_DIR/.verba-server-install-${STAMP}-$$"

          if [ ! -d "$ST_ROOT" ] || [ ! -f "$ST_ROOT/server.js" ]; then
            echo "SillyTavern 경로를 찾지 못했습니다: $ST_ROOT" >&2
            echo "사용법: bash install-server.sh /실제/SillyTavern/경로" >&2
            exit 1
          fi
          command -v git >/dev/null 2>&1 || { echo "git이 필요합니다." >&2; exit 1; }
          command -v node >/dev/null 2>&1 || { echo "Node.js가 필요합니다." >&2; exit 1; }
          mkdir -p "$PLUGINS_DIR" "$BACKUP_ROOT"
          trap 'rm -rf "$TEMP"' EXIT

          backup_dir() {
            local source="$1"
            local label="$2"
            local target="$BACKUP_ROOT/${label}-${STAMP}"
            local n=1
            while [ -e "$target" ]; do target="$BACKUP_ROOT/${label}-${STAMP}-$n"; n=$((n+1)); done
            mv "$source" "$target"
            echo "기존 폴더를 보존했습니다: $target"
          }

          is_verba_server_dir() {
            local dir="$1"
            [ -d "$dir" ] || return 1
            node - "$dir" <<'NODE' >/dev/null 2>&1
          const fs=require('node:fs'),path=require('node:path');
          const dir=process.argv[2];
          const candidates=[];
          const pkg=path.join(dir,'package.json');
          if(fs.existsSync(pkg)){
            try{const value=JSON.parse(fs.readFileSync(pkg,'utf8'));if(value.main)candidates.push(path.join(dir,value.main));}catch{}
          }
          for(const name of ['index.cjs','index.js','index.mjs','server-plugin/index.cjs'])candidates.push(path.join(dir,name));
          const found=candidates.some(file=>fs.existsSync(file)&&/\bid\s*:\s*['"]verba-server['"]/.test(fs.readFileSync(file,'utf8')));
          process.exit(found?0:1);
          NODE
          }

          verify_install() {
            local dir="$1"
            node - "$dir" <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const dir=process.argv[2];
          const pkg=JSON.parse(fs.readFileSync(path.join(dir,'package.json'),'utf8'));
          const entry=path.join(dir,pkg.main||'');
          if(pkg.main!=='server-plugin/index.cjs'||!fs.existsSync(entry))throw Error('Verba Server 설치 검증 실패');
          const source=fs.readFileSync(entry,'utf8');
          if(!/\bid\s*:\s*['"]verba-server['"]/.test(source))throw Error('Verba Server 진입점 검증 실패');
          const server=JSON.parse(fs.readFileSync(path.join(dir,'server-plugin/package.json'),'utf8'));
          console.log(`Verba Server ${server.version}`);
          NODE
          }

          accepted_remote() {
            local remote="$1"
            [ "$remote" = "$REPO_URL" ] \
              || [ "$remote" = "https://github.com/foreverharibo-boop/verba.git" ] \
              || [ "$remote" = "https://github.com/foreverharibo-boop/verba" ] \
              || [ "$remote" = "git@github.com:foreverharibo-boop/verba.git" ]
          }

          updated=false
          if [ -e "$DEST" ] \
            && git -C "$DEST" rev-parse --is-inside-work-tree >/dev/null 2>&1 \
            && [ "$(git -C "$DEST" rev-parse --show-toplevel 2>/dev/null)" = "$DEST" ]; then
            remote="$(git -C "$DEST" remote get-url origin 2>/dev/null || true)"
            if accepted_remote "$remote"; then
              git -C "$DEST" fetch origin "$REPO_BRANCH"
              git -C "$DEST" checkout "$REPO_BRANCH"
              git -C "$DEST" pull --ff-only origin "$REPO_BRANCH"
              verify_install "$DEST" >/dev/null
              updated=true
            fi
          fi

          if [ "$updated" != true ]; then
            rm -rf "$TEMP"
            git clone --depth 1 --single-branch --branch "$REPO_BRANCH" "$REPO_URL" "$TEMP"
            verify_install "$TEMP" >/dev/null

            # Only after the new download is complete and verified do we move
            # old/duplicate copies out of the active plugin directory.
            for candidate in "$PLUGINS_DIR"/*; do
              [ -e "$candidate" ] || continue
              [ "$candidate" = "$DEST" ] && continue
              [ "$candidate" = "$TEMP" ] && continue
              if is_verba_server_dir "$candidate"; then
                backup_dir "$candidate" "duplicate-$(basename "$candidate")"
              fi
            done
            if [ -e "$DEST" ]; then backup_dir "$DEST" "legacy-verba-server"; fi
            mv "$TEMP" "$DEST"
          else
            for candidate in "$PLUGINS_DIR"/*; do
              [ -e "$candidate" ] || continue
              [ "$candidate" = "$DEST" ] && continue
              if is_verba_server_dir "$candidate"; then
                backup_dir "$candidate" "duplicate-$(basename "$candidate")"
              fi
            done
          fi

          version="$(node -p "require(process.argv[1]).version" "$DEST/server-plugin/package.json")"
          echo "Verba Server $version Git 설치·업데이트 완료"
          echo
          echo "앞으로 새 폴더를 받을 필요가 없습니다."
          echo "- SillyTavern 시작 시 enableServerPluginsAutoUpdate가 켜져 있으면 자동 업데이트"
          echo "- 수동 업데이트: cd \"$ST_ROOT\" && node plugins.js update"
          echo "SillyTavern 서버를 완전히 재시작해 주세요."
          INSTALLER
          sed -i 's/^          //' install-server.sh
          chmod +x install-server.sh

          cat > server-plugin/tests/install.test.cjs <<'TEST'
          const test=require('node:test');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const os=require('node:os');
          const path=require('node:path');
          const {spawnSync}=require('node:child_process');
          const source=path.resolve(__dirname,'../..');
          function git(cwd,args){const r=spawnSync('git',args,{cwd,encoding:'utf8'});assert.equal(r.status,0,r.stderr||r.stdout);return r.stdout.trim();}
          function fixture(t){
            const root=fs.mkdtempSync(path.join(os.tmpdir(),'verba git install '));
            t.after(()=>fs.rmSync(root,{recursive:true,force:true}));
            const st=path.join(root,'Silly Tavern');fs.mkdirSync(st);
            fs.writeFileSync(path.join(st,'server.js'),'// fixture');
            fs.writeFileSync(path.join(st,'config.yaml'),'keep: true');
            return {root,st,dest:path.join(st,'plugins/verba-server'),backups:path.join(st,'.verba-server-backups')};
          }
          function makeRepository(root){
            const repo=path.join(root,'repository');fs.mkdirSync(repo);
            fs.copyFileSync(path.join(source,'package.json'),path.join(repo,'package.json'));
            fs.copyFileSync(path.join(source,'README.md'),path.join(repo,'README.md'));
            fs.cpSync(path.join(source,'server-plugin'),path.join(repo,'server-plugin'),{recursive:true});
            git(repo,['init','-b','main']);git(repo,['config','user.name','test']);git(repo,['config','user.email','test@example.invalid']);
            git(repo,['add','.']);git(repo,['commit','-m','fixture server']);return repo;
          }
          function install(st,repo){return spawnSync('bash',[path.join(source,'install-server.sh'),st],{encoding:'utf8',env:{...process.env,VERBA_SERVER_REPO_URL:repo,VERBA_SERVER_REPO_BRANCH:'main'}});}
          function legacyPlugin(dir,label='legacy-data'){
            fs.mkdirSync(dir,{recursive:true});fs.writeFileSync(path.join(dir,'package.json'),JSON.stringify({main:'index.cjs'}));
            fs.writeFileSync(path.join(dir,'index.cjs'),"module.exports.info={id:'verba-server'};");
            fs.writeFileSync(path.join(dir,'legacy-note.txt'),label);
          }
          test('verified Git install atomically migrates a copied plugin and later pulls updates',t=>{
            const {root,st,dest,backups}=fixture(t),repo=makeRepository(root);legacyPlugin(dest,'preserve me');
            const outside=path.join(root,'outside.txt');fs.writeFileSync(outside,'unchanged');fs.symlinkSync(outside,path.join(dest,'legacy-link'));
            const first=install(st,repo);assert.equal(first.status,0,first.stderr||first.stdout);assert.match(first.stdout,/0\.1\.6/);
            assert.equal(git(dest,['rev-parse','--show-toplevel']),dest);
            assert.equal(JSON.parse(fs.readFileSync(path.join(dest,'package.json'))).main,'server-plugin/index.cjs');
            assert.equal(JSON.parse(fs.readFileSync(path.join(dest,'server-plugin/package.json'))).version,'0.1.6');
            assert.equal(fs.readFileSync(path.join(st,'config.yaml'),'utf8'),'keep: true');assert.equal(fs.readFileSync(outside,'utf8'),'unchanged');
            const saved=fs.readdirSync(backups).filter(name=>name.startsWith('legacy-verba-server-'));assert.equal(saved.length,1);
            assert.equal(fs.readFileSync(path.join(backups,saved[0],'legacy-note.txt'),'utf8'),'preserve me');
            fs.writeFileSync(path.join(repo,'server-plugin/update-marker.txt'),'updated through git');git(repo,['add','.']);git(repo,['commit','-m','server update']);
            const second=install(st,repo);assert.equal(second.status,0,second.stderr||second.stdout);
            assert.equal(fs.readFileSync(path.join(dest,'server-plugin/update-marker.txt'),'utf8'),'updated through git');
            assert.equal(fs.readdirSync(backups).filter(name=>name.startsWith('legacy-verba-server-')).length,1);
          });
          test('duplicate Verba Server copies are backed up while unrelated plugins remain active',t=>{
            const {root,st,dest,backups}=fixture(t),repo=makeRepository(root);
            const duplicate=path.join(st,'plugins/verba-server-old-copy');legacyPlugin(duplicate,'duplicate');
            const unrelated=path.join(st,'plugins/unrelated');fs.mkdirSync(unrelated,{recursive:true});
            fs.writeFileSync(path.join(unrelated,'package.json'),JSON.stringify({main:'index.cjs'}));fs.writeFileSync(path.join(unrelated,'index.cjs'),"module.exports.info={id:'another-plugin'};");
            const result=install(st,repo);assert.equal(result.status,0,result.stderr||result.stdout);
            assert.ok(fs.existsSync(dest));assert.ok(fs.existsSync(unrelated));assert.ok(!fs.existsSync(duplicate));
            const saved=fs.readdirSync(backups).filter(name=>name.startsWith('duplicate-verba-server-old-copy-'));assert.equal(saved.length,1);
            assert.equal(fs.readFileSync(path.join(backups,saved[0],'legacy-note.txt'),'utf8'),'duplicate');
          });
          test('failed download leaves the legacy active plugin untouched',t=>{
            const {root,st,dest}=fixture(t);legacyPlugin(dest,'still active');
            const missing=path.join(root,'missing-repository');const result=install(st,missing);assert.notEqual(result.status,0);
            assert.equal(fs.readFileSync(path.join(dest,'legacy-note.txt'),'utf8'),'still active');
          });
          test('invalid SillyTavern path fails before creating a plugin',t=>{
            const root=fs.mkdtempSync(path.join(os.tmpdir(),'verba invalid install '));t.after(()=>fs.rmSync(root,{recursive:true,force:true}));
            const repo=makeRepository(root),st=path.join(root,'not-silly');fs.mkdirSync(st);const result=install(st,repo);assert.notEqual(result.status,0);
            assert.equal(fs.existsSync(path.join(st,'plugins/verba-server')),false);
          });
          TEST
          sed -i 's/^          //' server-plugin/tests/install.test.cjs

      - name: Run unified regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check index.js
          node --check source-change-tracer.js
          node --check browser-execution-diagnostics.js
          node --check server-plugin/index.cjs
          node tests/automatic-output.mjs
          node tests/main-background-diagnostics.mjs
          node tests/full-source-preference.mjs
          node tests/full-source-warning-once.mjs
          node tests/bilingual-intent.mjs
          node tests/bilingual-source-recovery-smoke.mjs
          npm test --prefix server-plugin

      - name: Commit unified branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "Merge server translation into main-ready Verba (v0.6.66)"
          git push origin HEAD:codex/server-translation-experimental
