name: Unify server translation into main v3
on:
  push:
    branches:
      - codex/server-translation-experimental
    paths:
      - .github/workflows/unify-main-once-v3.yml
permissions:
  contents: write
jobs:
  unify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/server-translation-experimental
          fetch-depth: 0
      - name: Merge and apply dedented unification script
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U | sort)"
            expected="README.md
          index.js
          manifest.json
          source-change-tracer.js"
            if [ "$conflicts" != "$expected" ]; then
              echo "Unexpected conflicts:"
              printf '%s\n' "$conflicts"
              exit 1
            fi
          fi
          git checkout --ours README.md index.js manifest.json source-change-tracer.js
          git add README.md index.js manifest.json source-change-tracer.js

          python3 <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/unify-main-once.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          old1 = '"function handleGenerationEnded() {\\n    const ready = automaticOutputLifecycle.end();"'
          new1 = '"function handleGenerationEnded() {\\n    traceLatestAssistantSource(\'generation-ended\');\\n    const ready = automaticOutputLifecycle.end();"'
          old2 = '"function handleGenerationEnded() {\\n    executionTrace.trace(\'generation-ended\');\\n    const ready = automaticOutputLifecycle.end();"'
          new2 = '"function handleGenerationEnded() {\\n    executionTrace.trace(\'generation-ended\');\\n    traceLatestAssistantSource(\'generation-ended\');\\n    const ready = automaticOutputLifecycle.end();"'
          if script.count(old1) != 1 or script.count(old2) != 1:
              raise SystemExit(f'embedded anchor counts: source={script.count(old1)} replacement={script.count(old2)}')
          Path('/tmp/unify-main.py').write_text(script.replace(old1, new1, 1).replace(old2, new2, 1))
          PY
          python3 /tmp/unify-main.py

          rm -rf tools/node_modules
          touch .gitignore
          grep -qxF 'tools/node_modules/' .gitignore || printf '\ntools/node_modules/\n' >> .gitignore
          chmod +x install-server.sh

      - name: Run unified regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check index.js
          node --check source-change-tracer.js
          node --check browser-execution-diagnostics.js
          node --check server-plugin/index.cjs
          node tests/automatic-output.mjs
          node tests/main-background-diagnostics.mjs
          node tests/full-source-preference.mjs
          node tests/full-source-warning-once.mjs
          node tests/bilingual-intent.mjs
          node tests/bilingual-source-recovery-smoke.mjs
          npm test --prefix server-plugin

      - name: Commit unified branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "Merge server translation into main-ready Verba (v0.6.66)"
          git push origin HEAD:codex/server-translation-experimental
