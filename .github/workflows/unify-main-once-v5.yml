name: Unify server translation into main v5
on:
  push:
    branches:
      - codex/server-translation-experimental
    paths:
      - .github/workflows/unify-main-once-v5.yml
permissions:
  contents: write
jobs:
  unify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/server-translation-experimental
          fetch-depth: 0
      - name: Merge and apply unified code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U | sort)"
            expected="README.md
          index.js
          manifest.json
          source-change-tracer.js"
            if [ "$conflicts" != "$expected" ]; then
              echo "Unexpected conflicts:"
              printf '%s\n' "$conflicts"
              exit 1
            fi
          fi
          git checkout --ours README.md index.js manifest.json source-change-tracer.js
          git add README.md index.js manifest.json source-change-tracer.js

          python3 <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/unify-main-once.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          old1 = '"function handleGenerationEnded() {\\n    const ready = automaticOutputLifecycle.end();"'
          new1 = '"function handleGenerationEnded() {\\n    traceLatestAssistantSource(\'generation-ended\');\\n    const ready = automaticOutputLifecycle.end();"'
          old2 = '"function handleGenerationEnded() {\\n    executionTrace.trace(\'generation-ended\');\\n    const ready = automaticOutputLifecycle.end();"'
          new2 = '"function handleGenerationEnded() {\\n    executionTrace.trace(\'generation-ended\');\\n    traceLatestAssistantSource(\'generation-ended\');\\n    const ready = automaticOutputLifecycle.end();"'
          if script.count(old1) != 1 or script.count(old2) != 1:
              raise SystemExit(f'embedded anchor counts: source={script.count(old1)} replacement={script.count(old2)}')
          Path('/tmp/unify-main.py').write_text(script.replace(old1, new1, 1).replace(old2, new2, 1))
          PY
          python3 /tmp/unify-main.py

          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              return text.replace(old, new, 1)

          index_path = Path('index.js')
          index = index_path.read_text()
          start = index.index('function scheduleSwipeTranslation(')
          end = index.index('\nfunction ', start + 1)
          body = index[start:end]
          body = replace_once(
              body,
              "        timer: null,\n        check: null,\n    };",
              "        timer: null,\n        check: null,\n        dispatchStarted: false,\n    };",
              'swipe dispatch state',
          )
          body = replace_once(
              body,
              "        if (swipeTranslationJobs.get(id) !== job) return;",
              "        if (swipeTranslationJobs.get(id) !== job || job.dispatchStarted) return;",
              'swipe duplicate guard',
          )
          body = replace_once(
              body,
              "        if (signature !== job.candidateSignature) {\n            job.candidateSignature = signature;\n            job.stableChecks = 0;\n            job.timer = setTimeout(check, 120);\n            return;\n        }",
              "        if (signature !== job.candidateSignature) {\n            job.candidateSignature = signature;\n            job.stableChecks = 0;\n            // A real completion signal proves this exact active swipe/source.\n            // Recheck in a microtask so Android background timer throttling\n            // cannot postpone an already completed swipe translation.\n            if (job.rendered && automaticOutputLifecycle.isComplete(id)) {\n                automaticOutputLifecycle.trace('swipe-final-microtask', id);\n                executionTrace.trace('swipe-final-microtask', id);\n                queueMicrotask(check);\n            } else {\n                job.timer = setTimeout(check, 120);\n            }\n            return;\n        }",
              'completed swipe microtask',
          )
          body = replace_once(
              body,
              "        Promise.resolve(translateMessage(id, { automatic: true })).finally(() => {",
              "        job.dispatchStarted = true;\n        Promise.resolve(translateMessage(id, { automatic: true })).finally(() => {",
              'swipe dispatch latch',
          )
          index_path.write_text(index[:start] + body + index[end:])

          test_path = Path('tests/automatic-output.mjs')
          test = test_path.read_text()
          test = replace_once(
              test,
              "        executionTrace: { trace() {} },\n        isTranslationExtensionActive:",
              "        executionTrace: { trace() {}, heartbeat() {}, page() {}, clear() {} },\n        traceSourceForMessage() {}, traceLatestAssistantSource() {},\n        isTranslationExtensionActive:",
              'automatic-output diagnostic stubs',
          )
          test = test.replace(
              "assert.match(source, /automaticOutput: automaticOutputLifecycle\\.diagnostics\\(\\)/);",
              "assert.match(source, /automaticOutput:[^\\n]*automaticOutputLifecycle\\.diagnostics\\(\\)/);",
              1,
          )
          test = test.replace(
              "assert.match(source, /source\\.on\\(types\\.CHAT_CHANGED, \\(\\) => \\{\\s*automaticOutputLifecycle\\.reset\\(\\)/);",
              "assert.match(source, /source\\.on\\(types\\.CHAT_CHANGED,[\\s\\S]*?automaticOutputLifecycle\\.reset\\(\\)/);",
              1,
          )
          test_path.write_text(test)
          PY

          rm -rf tools/node_modules
          touch .gitignore
          grep -qxF 'tools/node_modules/' .gitignore || printf '\ntools/node_modules/\n' >> .gitignore
          chmod +x install-server.sh

      - name: Run unified regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check index.js
          node --check source-change-tracer.js
          node --check browser-execution-diagnostics.js
          node --check server-plugin/index.cjs
          node tests/automatic-output.mjs
          node tests/main-background-diagnostics.mjs
          node tests/full-source-preference.mjs
          node tests/full-source-warning-once.mjs
          node tests/bilingual-intent.mjs
          node tests/bilingual-source-recovery-smoke.mjs
          npm test --prefix server-plugin

      - name: Commit unified branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "Merge server translation into main-ready Verba (v0.6.66)"
          git push origin HEAD:codex/server-translation-experimental
