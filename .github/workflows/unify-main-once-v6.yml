name: Unify server translation into main v6
on:
  push:
    branches:
      - codex/server-translation-experimental
    paths:
      - .github/workflows/unify-main-once-v6.yml
permissions:
  contents: write
jobs:
  unify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/server-translation-experimental
          fetch-depth: 0
      - name: Reuse verified merge and swipe patches
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/unify-main-once-v5.yml').read_text()
          start_marker = '      - name: Merge and apply unified code\n'
          start = source.index(start_marker)
          run = source.index('        run: |\n', start) + len('        run: |\n')
          end = source.index('      - name: Run unified regressions\n', run)
          Path('/tmp/base-unify.sh').write_text(textwrap.dedent(source[run:end]))
          PY
          bash /tmp/base-unify.sh

      - name: Merge detailed and lightweight source diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              return text.replace(old, new, 1)

          path = Path('source-change-tracer.js')
          text = path.read_text()
          text = replace_once(
              text,
              "    const logChange = (entry, before, after, method, field, phase, writer = null) => {\n        if (before === after) return;\n        const change = describeChange(before, after);\n        push({\n            event: 'source-changed', messageId: entry.id, method, field, phase,\n            ...change, ...textSnapshot(before, after, change),\n            ...(writer || { possibleWriter: null, frames: [] }),\n        });\n    };",
              "    const logChange = (entry, before, after, method, field, phase, writer = null, effective = true) => {\n        if (!isEnabled() || before === after) return;\n        const change = describeChange(before, after);\n        push({\n            event: 'source-changed', messageId: entry.id, method, field, phase,\n            ...change, ...textSnapshot(before, after, change),\n            effectiveSourceChanged: effective,\n            ...(writer || { possibleWriter: null, frames: [] }),\n        });\n    };",
              'effective change logger',
          )
          text = replace_once(
              text,
              "        const set = next => {\n            const active = isEnabled();\n            const before = active ? safeRead(entry.message) : null;\n            value = next;\n            if (active) {\n                const after = safeRead(entry.message);\n                logChange(entry, before, after, 'property-write', path, entry.phase, callingCode());\n                entry.lastSource = after;\n            }\n            try { changed?.(); } catch { /* Diagnostics must never block source writes. */ }\n        };",
              "        const set = next => {\n            const active = isEnabled();\n            const beforeEffective = active ? safeRead(entry.message) : '';\n            const old = value;\n            value = next;\n            if (active) {\n                const afterEffective = safeRead(entry.message);\n                const ownText = typeof old === 'string' && typeof next === 'string';\n                const before = ownText ? old : beforeEffective;\n                const after = ownText ? next : afterEffective;\n                logChange(entry, before, after, 'property-write', path, entry.phase,\n                    callingCode(), beforeEffective !== afterEffective);\n                entry.lastSource = afterEffective;\n                entry.lastMes = typeof entry.message?.mes === 'string' ? entry.message.mes : '';\n            }\n            try { changed?.(); } catch { /* Diagnostics must never block source writes. */ }\n        };",
              'field/effective source separation',
          )
          text = replace_once(
              text,
              "        const source = safeRead(message);\n        let entry = tracked.get(id);",
              "        const source = safeRead(message);\n        const mes = typeof message.mes === 'string' ? message.mes : '';\n        let entry = tracked.get(id);",
              'observe mes snapshot',
          )
          text = replace_once(
              text,
              "            entry = { id, message, lastSource: source, phase, restores: [], swipeStop: null, swipeNestedStops: [] };",
              "            entry = { id, message, lastSource: source, lastMes: mes, phase, restores: [], swipeStop: null, swipeNestedStops: [] };",
              'tracked mes state',
          )
          text = replace_once(
              text,
              "        logChange(entry, entry.lastSource, source, 'checkpoint-difference', 'effective-source', phase);\n        entry.lastSource = source;\n        entry.phase = phase;",
              "        logChange(entry, entry.lastSource, source, 'checkpoint-difference', 'effective-source', phase, null, true);\n        if (entry.lastSource === source) {\n            logChange(entry, entry.lastMes, mes, 'checkpoint-difference', 'message.mes', phase, null, false);\n        }\n        entry.lastSource = source;\n        entry.lastMes = mes;\n        entry.phase = phase;",
              'checkpoint effective compatibility',
          )
          text = replace_once(
              text,
              "            event: 'server-versus-live', messageId: id, phase, ...change, ...textSnapshot(before, after, change),\n            possibleWriter: null,",
              "            event: 'server-versus-live', messageId: id, method: 'output-snapshot-compare',\n            field: 'effective-source', phase, ...change, ...textSnapshot(before, after, change),\n            effectiveSourceChanged: true, possibleWriter: null,",
              'comparison compatibility fields',
          )
          path.write_text(text)

          test_path = Path('tests/main-background-diagnostics.mjs')
          test = test_path.read_text()
          test = replace_once(
              test,
              "    for(let i=0;i<5;i++)msg.mes='changed '+i;\n    assert.equal(tracer.diagnostics().events.filter(row=>typeof row.beforeText==='string').length,3);",
              "    for(let i=0;i<5;i++)msg.mes='changed '+i;\n    assert.equal(tracer.diagnostics().events.filter(row=>typeof row.beforeText==='string').length,7);\n    for(let i=5;i<10;i++)msg.mes='changed '+i;\n    assert.equal(tracer.diagnostics().events.filter(row=>typeof row.beforeText==='string').length,8);\n    assert.ok(tracer.diagnostics().events.some(row=>row.fullTextExpired===true));",
              'persistent eight-event detail limit',
          )
          test_path.write_text(test)
          PY

      - name: Run unified regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check index.js
          node --check source-change-tracer.js
          node --check browser-execution-diagnostics.js
          node --check server-plugin/index.cjs
          node tests/automatic-output.mjs
          node tests/main-background-diagnostics.mjs
          node tests/full-source-preference.mjs
          node tests/full-source-warning-once.mjs
          node tests/bilingual-intent.mjs
          node tests/bilingual-source-recovery-smoke.mjs
          npm test --prefix server-plugin

      - name: Commit unified branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "Merge server translation into main-ready Verba (v0.6.66)"
          git push origin HEAD:codex/server-translation-experimental
