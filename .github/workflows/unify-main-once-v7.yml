name: Unify server translation into main v7
on:
  push:
    branches:
      - codex/server-translation-experimental
    paths:
      - .github/workflows/unify-main-once-v7.yml
permissions:
  contents: write
jobs:
  unify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/server-translation-experimental
          fetch-depth: 0
      - name: Reuse verified merge, swipe and diagnostic patches
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/unify-main-once-v6.yml').read_text()
          names = [
              'Reuse verified merge and swipe patches',
              'Merge detailed and lightweight source diagnostics',
          ]
          chunks=[]
          for name in names:
              marker=f'      - name: {name}\n'
              start=source.index(marker)
              run=source.index('        run: |\n',start)+len('        run: |\n')
              next_step=source.find('      - name: ',run)
              chunks.append(textwrap.dedent(source[run:next_step]))
          Path('/tmp/base-unify.sh').write_text('\n'.join(chunks))
          PY
          bash /tmp/base-unify.sh

      - name: Convert installer tests to Git-managed migration
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count=text.count(old)
              if count!=1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              return text.replace(old,new,1)

          installer_path=Path('install-server.sh')
          installer=installer_path.read_text()
          installer=replace_once(
              installer,
              'REPO_URL="https://github.com/foreverharibo-boop/verba.git"\nBACKUP_ROOT=',
              'REPO_URL="${VERBA_SERVER_REPO_URL:-https://github.com/foreverharibo-boop/verba.git}"\nREPO_BRANCH="${VERBA_SERVER_REPO_BRANCH:-main}"\nBACKUP_ROOT=',
              'installer repository override',
          )
          old='''              case "$remote" in
                https://github.com/foreverharibo-boop/verba.git|https://github.com/foreverharibo-boop/verba|git@github.com:foreverharibo-boop/verba.git)
                  git -C "$DEST" fetch origin main
                  git -C "$DEST" checkout main
                  git -C "$DEST" pull --ff-only origin main
                  ;;
                *)
                  backup_dir "$DEST" "legacy-verba-server"
                  ;;
              esac'''
          new='''              case "$remote" in
                "$REPO_URL"|https://github.com/foreverharibo-boop/verba.git|https://github.com/foreverharibo-boop/verba|git@github.com:foreverharibo-boop/verba.git)
                  git -C "$DEST" fetch origin "$REPO_BRANCH"
                  git -C "$DEST" checkout "$REPO_BRANCH"
                  git -C "$DEST" pull --ff-only origin "$REPO_BRANCH"
                  ;;
                *)
                  backup_dir "$DEST" "legacy-verba-server"
                  ;;
              esac'''
          installer=replace_once(installer,old,new,'installer Git update branch')
          installer=replace_once(
              installer,
              'git clone --depth 1 --single-branch --branch main "$REPO_URL" "$DEST"',
              'git clone --depth 1 --single-branch --branch "$REPO_BRANCH" "$REPO_URL" "$DEST"',
              'installer Git clone branch',
          )
          installer_path.write_text(installer)

          test= r'''const test=require('node:test');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const os=require('node:os');
          const path=require('node:path');
          const {spawnSync}=require('node:child_process');
          const source=path.resolve(__dirname,'../..');

          function git(cwd,args){
            const result=spawnSync('git',args,{cwd,encoding:'utf8'});
            assert.equal(result.status,0,result.stderr||result.stdout);
            return result.stdout.trim();
          }
          function fixture(t){
            const root=fs.mkdtempSync(path.join(os.tmpdir(),'verba git install '));
            t.after(()=>fs.rmSync(root,{recursive:true,force:true}));
            const st=path.join(root,'Silly Tavern');fs.mkdirSync(st);
            fs.writeFileSync(path.join(st,'server.js'),'// fixture');
            fs.writeFileSync(path.join(st,'config.yaml'),'keep: true');
            return {root,st,dest:path.join(st,'plugins/verba-server'),backups:path.join(st,'.verba-server-backups')};
          }
          function makeRepository(root){
            const repo=path.join(root,'verba-server-repository');
            fs.mkdirSync(repo);
            fs.copyFileSync(path.join(source,'package.json'),path.join(repo,'package.json'));
            fs.copyFileSync(path.join(source,'README.md'),path.join(repo,'README.md'));
            fs.cpSync(path.join(source,'server-plugin'),path.join(repo,'server-plugin'),{recursive:true});
            git(repo,['init','-b','main']);
            git(repo,['config','user.name','test']);
            git(repo,['config','user.email','test@example.invalid']);
            git(repo,['add','.']);git(repo,['commit','-m','fixture server']);
            return repo;
          }
          function install(st,repo){
            return spawnSync('bash',[path.join(source,'install-server.sh'),st],{
              encoding:'utf8',
              env:{...process.env,VERBA_SERVER_REPO_URL:repo,VERBA_SERVER_REPO_BRANCH:'main'},
            });
          }
          function legacyPlugin(dir,label='legacy-data'){
            fs.mkdirSync(dir,{recursive:true});
            fs.writeFileSync(path.join(dir,'package.json'),JSON.stringify({main:'index.cjs'}));
            fs.writeFileSync(path.join(dir,'index.cjs'),"module.exports.info={id:'verba-server'};");
            fs.writeFileSync(path.join(dir,'legacy-note.txt'),label);
          }

          test('one-time migration backs up a copied plugin, installs a Git root, then updates in place',t=>{
            const {root,st,dest,backups}=fixture(t),repo=makeRepository(root);
            legacyPlugin(dest,'preserve me');
            const outside=path.join(root,'outside.txt');fs.writeFileSync(outside,'unchanged');
            fs.symlinkSync(outside,path.join(dest,'legacy-link'));
            const first=install(st,repo);assert.equal(first.status,0,first.stderr||first.stdout);
            assert.match(first.stdout,/0\.1\.6/);
            assert.equal(git(dest,['rev-parse','--show-toplevel']),dest);
            assert.equal(JSON.parse(fs.readFileSync(path.join(dest,'package.json'))).main,'server-plugin/index.cjs');
            assert.equal(JSON.parse(fs.readFileSync(path.join(dest,'server-plugin/package.json'))).version,'0.1.6');
            assert.equal(fs.readFileSync(path.join(st,'config.yaml'),'utf8'),'keep: true');
            assert.equal(fs.readFileSync(outside,'utf8'),'unchanged');
            const saved=fs.readdirSync(backups).filter(name=>name.startsWith('legacy-verba-server-'));
            assert.equal(saved.length,1);
            assert.equal(fs.readFileSync(path.join(backups,saved[0],'legacy-note.txt'),'utf8'),'preserve me');

            fs.writeFileSync(path.join(repo,'server-plugin','update-marker.txt'),'updated through git');
            git(repo,['add','.']);git(repo,['commit','-m','server update']);
            const second=install(st,repo);assert.equal(second.status,0,second.stderr||second.stdout);
            assert.equal(fs.readFileSync(path.join(dest,'server-plugin/update-marker.txt'),'utf8'),'updated through git');
            assert.equal(fs.readdirSync(backups).filter(name=>name.startsWith('legacy-verba-server-')).length,1);
          });

          test('duplicate Verba Server copies leave the active plugin directory while unrelated plugins remain',t=>{
            const {root,st,dest,backups}=fixture(t),repo=makeRepository(root);
            const duplicate=path.join(st,'plugins/verba-server-old-copy');legacyPlugin(duplicate,'duplicate');
            const unrelated=path.join(st,'plugins/unrelated');fs.mkdirSync(unrelated,{recursive:true});
            fs.writeFileSync(path.join(unrelated,'package.json'),JSON.stringify({main:'index.cjs'}));
            fs.writeFileSync(path.join(unrelated,'index.cjs'),"module.exports.info={id:'another-plugin'};");
            const result=install(st,repo);assert.equal(result.status,0,result.stderr||result.stdout);
            assert.ok(fs.existsSync(dest));assert.ok(fs.existsSync(unrelated));assert.ok(!fs.existsSync(duplicate));
            const saved=fs.readdirSync(backups).filter(name=>name.startsWith('duplicate-verba-server-old-copy-'));
            assert.equal(saved.length,1);
            assert.equal(fs.readFileSync(path.join(backups,saved[0],'legacy-note.txt'),'utf8'),'duplicate');
          });

          test('invalid SillyTavern path fails before creating a plugin',t=>{
            const root=fs.mkdtempSync(path.join(os.tmpdir(),'verba invalid install '));
            t.after(()=>fs.rmSync(root,{recursive:true,force:true}));
            const repo=makeRepository(root),st=path.join(root,'not-silly');fs.mkdirSync(st);
            const result=install(st,repo);assert.notEqual(result.status,0);
            assert.equal(fs.existsSync(path.join(st,'plugins/verba-server')),false);
          });
          '''
          test='\n'.join(line[10:] if line.startswith('          ') else line for line in test.splitlines())+'\n'
          Path('server-plugin/tests/install.test.cjs').write_text(test)
          PY

      - name: Run unified regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check index.js
          node --check source-change-tracer.js
          node --check browser-execution-diagnostics.js
          node --check server-plugin/index.cjs
          node tests/automatic-output.mjs
          node tests/main-background-diagnostics.mjs
          node tests/full-source-preference.mjs
          node tests/full-source-warning-once.mjs
          node tests/bilingual-intent.mjs
          node tests/bilingual-source-recovery-smoke.mjs
          npm test --prefix server-plugin

      - name: Commit unified branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "Merge server translation into main-ready Verba (v0.6.66)"
          git push origin HEAD:codex/server-translation-experimental
